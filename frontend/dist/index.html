<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>量子雷达 · QuantRadar</title>
<style>
  :root { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color:#1f2933; background:#f5f7fa; }
  * { box-sizing: border-box; }
  body { margin:0; }
  .app { max-width:1040px; margin:0 auto; padding:24px; }
  header h1 { margin:0 0 4px; font-size:28px; }
  .subtitle { margin:0 0 16px; color:#52606d; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  nav button { padding:8px 16px; border:1px solid #cbd2d9; background:#fff; border-radius:6px; cursor:pointer; }
  nav button.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:12px; }
  label { display:flex; flex-direction:column; font-size:13px; gap:4px; color:#52606d; }
  input, textarea { padding:6px 8px; border:1px solid #cbd2d9; border-radius:6px; font-size:14px; font-family:inherit; }
  textarea { width:100%; min-height:220px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  button.primary { padding:8px 16px; border:none; border-radius:6px; background:#2563eb; color:#fff; cursor:pointer; }
  button.primary:disabled { opacity:.6; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; background:#fff; margin-top:12px; }
  th, td { border:1px solid #e4e7eb; padding:6px 8px; text-align:right; font-size:13px; }
  th:first-child, td:first-child { text-align:left; }
  .result { background:#fff; border:1px solid #e4e7eb; border-radius:8px; padding:12px 16px; margin-top:12px; }
  .error { color:#b91c1c; }
  .ok { color:#15803d; }
  .muted { color:#9aa5b1; font-size:12px; }
  footer { margin-top:24px; color:#9aa5b1; font-size:12px; }
  .exp-item { background:#fff; border:1px solid #e4e7eb; border-radius:8px; padding:10px 14px; margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-all; background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; max-height:300px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>量子雷达 · QuantRadar</h1>
    <p class="subtitle" id="subtitle">基于本地真实数据、可审计、可复现的 A 股量化研究平台</p>
  </header>
  <nav>
    <button id="tab-price" class="active" onclick="show('price')">行情查询</button>
    <button id="tab-strategy" onclick="show('strategy')">策略回测</button>
    <button id="tab-experiments" onclick="show('experiments')">实验</button>
  </nav>
  <main>
    <section id="price">
      <h2>行情查询</h2>
      <div class="row">
        <label>代码<input id="p-security" value="600519.XSHG" /></label>
        <label>开始<input id="p-start" type="date" /></label>
        <label>结束<input id="p-end" type="date" /></label>
        <label>条数<input id="p-count" type="number" value="30" min="1" max="400" /></label>
        <button class="primary" onclick="queryPrice()">查询</button>
      </div>
      <div id="p-msg"></div>
      <div id="p-table"></div>
    </section>

    <section id="strategy" style="display:none">
      <h2>策略回测（JoinQuant 兼容）</h2>
      <p class="muted">策略使用引擎注入的全局：get_price / order_target / order_value / log / g / run_daily 等。勾选建仓即买入并持有。</p>
      <div class="row">
        <label>开始<input id="s-start" type="date" value="2023-01-01" /></label>
        <label>结束<input id="s-end" type="date" value="2023-03-31" /></label>
        <label>初始资金<input id="s-cash" type="number" value="500000" /></label>
        <button class="primary" onclick="runStrategy()">运行回测</button>
      </div>
      <textarea id="s-code"></textarea>
      <div id="s-msg"></div>
      <div id="s-result"></div>
    </section>

    <section id="experiments" style="display:none">
      <h2>实验列表</h2>
      <button class="primary" onclick="loadExperiments()">刷新</button>
      <div id="exp-list"></div>
    </section>
  </main>
  <footer>所有数据来自后端 /api/* 真实接口（InvestmentDataProvider → investment_data），前端不含任何价格或复权逻辑。</footer>
</div>

<script>
const DEFAULT_STRATEGY = `def initialize(context):
    context.security = "600519.XSHG"
    context.amount = 100

def handle_data(context, data):
    # 每个交易日：若未持仓则建仓（买入并持有）
    if not context.portfolio.positions:
        order_target(context.security, context.amount)
`;

function show(tab) {
  for (const t of ["price", "strategy", "experiments"]) {
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
    document.getElementById(t).style.display = t === tab ? "block" : "none";
  }
  if (tab === "experiments") loadExperiments();
}

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
  if (!r.ok) {
    const text = await r.text().catch(() => "");
    throw new Error(`HTTP ${r.status}: ${text || r.statusText}`);
  }
  return r.json();
}

async function queryPrice() {
  const msg = document.getElementById("p-msg");
  const tbl = document.getElementById("p-table");
  msg.textContent = "查询中…"; tbl.innerHTML = "";
  try {
    const params = new URLSearchParams({ security: document.getElementById("p-security").value });
    const sd = document.getElementById("p-start").value;
    const ed = document.getElementById("p-end").value;
    const count = document.getElementById("p-count").value;
    if (sd) params.set("start_date", sd);
    if (ed) params.set("end_date", ed);
    params.set("fq", "none");
    params.set("fields", "open,high,low,close,volume,amount");
    if (count) params.set("count", count);
    const data = await api("/api/price?" + params.toString());
    msg.textContent = `共 ${data.rows.length} 行`;
    if (!data.rows.length) return;
    const cols = ["date", "open", "high", "low", "close", "volume", "amount"];
    let html = "<table><thead><tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
    for (const row of data.rows) {
      html += "<tr>" + cols.map(c => `<td>${row[c] === null ? "-" : row[c]}</td>`).join("") + "</tr>";
    }
    html += "</tbody></table>";
    tbl.innerHTML = html;
  } catch (e) {
    msg.innerHTML = `<span class="error">${e.message}</span>`;
  }
}

let lastSnapshot = null;
async function runStrategy() {
  const msg = document.getElementById("s-msg");
  const res = document.getElementById("s-result");
  msg.textContent = "回测中…"; res.innerHTML = "";
  try {
    const body = {
      code: document.getElementById("s-code").value,
      start_date: document.getElementById("s-start").value || null,
      end_date: document.getElementById("s-end").value || null,
      initial_cash: Number(document.getElementById("s-cash").value),
      frequency: "day",
    };
    const data = await api("/api/backtest/strategy", { method: "POST", body: JSON.stringify(body) });
    const s = data.summary;
    lastSnapshot = data.snapshot;
    msg.innerHTML = `<span class="ok">回测完成</span>`;
    res.innerHTML = `
      <div class="result">
        <h3>回测摘要</h3>
        <ul>
          <li>区间：${s.start_date} ~ ${s.end_date}</li>
          <li>交易日数：${s.records_count}</li>
          <li>成交笔数：${s.trades_count}</li>
          <li>期末总值：${s.final_total_value}</li>
          <li>快照指纹：${data.snapshot.result_fingerprint}（asof ${data.snapshot.asof}）</li>
        </ul>
        <button class="primary" onclick="saveExperiment()">保存为实验</button>
        <span id="s-saved"></span>
      </div>`;
  } catch (e) {
    msg.innerHTML = `<span class="error">${e.message}</span>`;
  }
}

async function saveExperiment() {
  const el = document.getElementById("s-saved");
  if (!lastSnapshot) return;
  try {
    const name = lastSnapshot.result_fingerprint;
    const r = await api("/api/experiments/save", {
      method: "POST",
      body: JSON.stringify({ name, kind: "backtest", config: lastSnapshot.config || {}, snapshot: lastSnapshot }),
    });
    el.innerHTML = ` <span class="ok">已保存：${r.name}</span>`;
  } catch (e) {
    el.innerHTML = ` <span class="error">${e.message}</span>`;
  }
}

async function loadExperiments() {
  const list = document.getElementById("exp-list");
  list.innerHTML = "加载中…";
  try {
    const data = await api("/api/experiments");
    if (!data.experiments.length) { list.innerHTML = `<p class="muted">暂无实验</p>`; return; }
    let html = "";
    for (const name of data.experiments) {
      html += `<div class="exp-item"><b>${name}</b> <button onclick="loadOne('${name}', this)">查看</button><pre id="exp-${name}" style="display:none"></pre></div>`;
    }
    list.innerHTML = html;
  } catch (e) {
    list.innerHTML = `<span class="error">${e.message}</span>`;
  }
}

async function loadOne(name, btn) {
  const pre = document.getElementById("exp-" + name);
  if (pre.style.display === "none") {
    try {
      const data = await api("/api/experiments/" + encodeURIComponent(name));
      pre.textContent = JSON.stringify(data, null, 2);
      pre.style.display = "block";
      btn.textContent = "收起";
    } catch (e) {
      pre.textContent = e.message; pre.style.display = "block";
    }
  } else {
    pre.style.display = "none"; btn.textContent = "查看";
  }
}

(async function init() {
  document.getElementById("s-code").value = DEFAULT_STRATEGY;
  try {
    const h = await api("/api/health");
    document.getElementById("subtitle").textContent += `（数据源：${h.provider}）`;
  } catch (_) {}
})();
</script>
</body>
</html>
