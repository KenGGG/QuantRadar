[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantradar2"
version = "0.1.0"
description = "Local BulletTrade and BigQMT research workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
    "python-dotenv>=1,<2", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "playwright==1.63.0"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["quantradar2*"]

[tool.pytest.ini_options]
testpaths = ["tests/v2"]
pythonpath = ["backend"]
