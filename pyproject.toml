[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantradar"
version = "0.0.1"
description = "QuantRadar: 本地 A 股量化研究平台，基于 BulletTrade 代码基线继续开发"
requires-python = ">=3.11"
# 注意：BulletTrade 基线通过 vendor/bullet-trade 以 editable 方式单独安装：
#     pip install -e ./vendor/bullet-trade
# 不要通过 PyPI 安装另一份 bullet-trade，避免与源码版并存（见 docs/00 与 02）。
# 本项目（quantradar）自身的依赖在后续阶段（backend/ 服务等）追加。

[tool.setuptools]
# backend/ 当前为空，后续阶段在此声明包（如 backend/quantradar）。
packages = []
